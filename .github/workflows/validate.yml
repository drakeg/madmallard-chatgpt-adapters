name: Validate adapters
on:
  push:
  pull_request:
jobs:
  docs-and-installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify required files
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f adapters/scroll-craft/ADAPTER.md
          test -f scripts/install-scroll-craft.sh
      - name: Skill Creator static tests
        run: python3 -m unittest discover -s tests -p 'test_skill_creator.py'
      - name: AutoSwagger skill static tests
        run: python3 -m unittest discover -s tests -p 'test_autoswagger_skill.py'
      - name: Taste Design static tests
        run: python3 -m unittest discover -s tests -p 'test_taste_design.py'
      - name: Terraform skill static tests
        run: python3 -m unittest discover -s tests -p 'test_terraform_skill.py'
      - name: Shell syntax
        run: bash -n scripts/install-scroll-craft.sh
      - name: Basic adapter checks
        run: |
          grep -q 'https://github.com/nateherkai/scroll-craft' adapters/scroll-craft/ADAPTER.md
          grep -q 'ChatGPT' adapters/scroll-craft/ADAPTER.md
          grep -q 'global' README.md
